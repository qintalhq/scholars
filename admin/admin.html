<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
The Scholars Admin Panel
</title>


<link rel="stylesheet" href="../css/admin.css">


</head>


<body>


<!--==============================
LOGIN
==============================-->


<div class="admin-login" id="loginBox">


<div class="admin-login-card">


<h1>
The Scholars
</h1>


<p>
Admin Panel Login
</p>



<input

type="email"

id="adminEmail"

placeholder="Admin Email"

>



<input

type="password"

id="adminPassword"

placeholder="Password"

>



<button onclick="adminLogin()">

Login

</button>



<p id="loginError"></p>


</div>


</div>







<!--==============================
DASHBOARD
==============================-->


<div class="admin-dashboard" id="dashboard">



<!-- SIDEBAR -->

<aside class="sidebar">


<h2>
TS Admin
</h2>



<a href="#dashboardHome">
Dashboard
</a>



<a href="#resources">
Resources
</a>



<a href="#announcements">
Announcements
</a>



<a href="#codes">
Access Codes
</a>



<button onclick="logout()">

Logout

</button>



</aside>





<!-- MAIN -->

<main class="admin-main">


<header class="admin-header">


<h1>
Dashboard
</h1>



</header>
<!--==============================
DASHBOARD STATS
==============================-->


<section id="dashboardHome">


<div class="admin-stats">


<div class="admin-card">


<h2 id="resourceCount">

0

</h2>


<p>

Resources

</p>


</div>





<div class="admin-card">


<h2 id="announcementCount">

0

</h2>


<p>

Announcements

</p>


</div>





<div class="admin-card">


<h2 id="codeCount">

0

</h2>


<p>

Access Codes

</p>


</div>



</div>


</section>







<!--==============================
RESOURCE MANAGEMENT
==============================-->


<section id="resources">


<h2>

Add New Resource

</h2>




<form id="resourceForm">



<input

type="text"

id="resourceTitle"

placeholder="Resource title"

required

>




<textarea

id="resourceDescription"

placeholder="Description">

</textarea>





<input

type="text"

id="resourceSubject"

placeholder="Subject"

>




<input

type="text"

id="resourceChapter"

placeholder="Chapter"

>




<input

type="text"

id="resourceClass"

placeholder="Class"

>




<select id="resourceType">


<option value="notes">

Notes

</option>


<option value="pdf">

PDF

</option>


<option value="paper">

Question Paper

</option>


</select>





<input

type="url"

id="resourcePdf"

placeholder="PDF URL"

required

>




<button

class="admin-btn"

type="submit">

Add Resource

</button>



</form>



</section>
<!--==============================
RESOURCE TABLE
==============================-->


<section>


<div class="admin-section-header">


<h2>

Manage Resources

</h2>



<input

type="search"

id="adminSearch"

placeholder="Search resources..."

>


</div>





<table class="admin-table">


<thead>

<tr>

<th>
Title
</th>


<th>
Subject
</th>


<th>
Class
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="adminResourceList">


<!-- Resources load here -->


</tbody>



</table>


</section>








<!--==============================
ANNOUNCEMENTS
==============================-->



<section id="announcements">



<h2>

Announcements

</h2>





<form id="announcementForm">



<input

type="text"

id="announcementTitle"

placeholder="Announcement title"

required

>




<textarea

id="announcementMessage"

placeholder="Announcement message"

required>

</textarea>





<button

class="admin-btn"

type="submit">

Add Announcement

</button>



</form>





<table class="admin-table">


<thead>

<tr>


<th>

Title

</th>


<th>

Message

</th>


<th>

Action

</th>


</tr>


</thead>



<tbody id="announcementList">


<!-- Announcements load here -->


</tbody>


</table>



</section>
<!--==============================
ACCESS CODE MANAGEMENT
==============================-->


<section id="codes">



<h2>

Access Codes

</h2>





<form id="codeForm">



<input

type="text"

id="accessCode"

placeholder="Enter access code"

required

>




<label>

Expiry Date

</label>



<input

type="datetime-local"

id="codeExpiry"

>




<button

class="admin-btn"

type="submit">

Create Code

</button>



</form>







<table class="admin-table">


<thead>

<tr>


<th>

Code

</th>



<th>

Status

</th>



<th>

Expiry

</th>



<th>

Action

</th>


</tr>


</thead>



<tbody id="codeList">


<!-- Access codes load here -->


</tbody>


</table>





</section>

  <!--==============================
DASHBOARD END
==============================-->


</main>


</div>






<!--==============================
SCRIPTS
==============================-->



<!-- Supabase Library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>




<!-- Supabase Configuration -->

<script src="../supabase.js"></script>




<!-- Admin Logic -->

<script src="../js/admin.js"></script>



</body>

</html>
