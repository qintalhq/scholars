<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scholars Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

<header class="header">
    <div class="container">
        <h1>The Scholars Admin</h1>

        <button id="logoutBtn" class="open-btn">
            Logout
        </button>
    </div>
</header>

<main class="container">

    <!-- Statistics -->
    <section class="stats-grid">

        <div class="stat-card">
            <h3 id="resourceCount">0</h3>
            <p>Resources</p>
        </div>

        <div class="stat-card">
            <h3 id="announcementCount">0</h3>
            <p>Announcements</p>
        </div>

    </section>

    <!-- Add Resource -->

    <section class="admin-section">

        <h2>Add Resource</h2>

        <form id="resourceForm">

            <input
                type="text"
                id="title"
                placeholder="Title"
                required
            >

            <textarea
                id="description"
                placeholder="Description"
                required
            ></textarea>

            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required
            >

            <input
                type="text"
                id="chapter"
                placeholder="Chapter"
                required
            >

            <input
                type="text"
                id="class"
                placeholder="Class"
                required
            >

            <input
                type="text"
                id="resourceType"
                placeholder="Resource Type"
                required
            >

            <input
                type="url"
                id="thumbnail"
                placeholder="Thumbnail URL"
            >

            <input
                type="url"
                id="pdf"
                placeholder="PDF URL"
                required
            >

            <button class="open-btn" type="submit">
                Save Resource
            </button>

        </form>

    </section>

    <!-- Resources -->

    <section class="admin-section">

        <h2>Manage Resources</h2>

        <table>

            <thead>

            <tr>
                <th>Title</th>
                <th>Subject</th>
                <th>Class</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody id="resourceTable">

            </tbody>

        </table>

    </section>

    <!-- Announcements -->

    <section class="admin-section">

        <h2>Announcement</h2>

        <form id="announcementForm">

            <input
                type="text"
                id="announcementTitle"
                placeholder="Title"
                required
            >

            <textarea
                id="announcementMessage"
                placeholder="Message"
                required
            ></textarea>

            <button class="open-btn">
                Publish
            </button>

        </form>

    </section>

</main>

<script src="../js/supabase.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
