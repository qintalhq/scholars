<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scholars</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>The Scholars</h1>

            <input
                type="text"
                id="searchInput"
                placeholder="Search resources..."
            >
        </div>
    </header>

    <!-- Announcement -->
    <section class="announcement container">
        <h2>Announcements</h2>
        <div id="announcementBox">
            Loading...
        </div>
    </section>

    <!-- Resources -->
    <main class="container">

        <h2>Latest Resources</h2>

        <div id="resourceContainer" class="resource-grid">
            Loading resources...
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 The Scholars</p>
    </footer>

    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
