<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Scholars | Educational Resources</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">


    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css">


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>


</head>


<body>



<!-- =====================
     Header
===================== -->


<header class="header">


    <div class="container">


        <h1>
            The Scholars
        </h1>


        <p class="tagline">
            Quality notes, PYQs and study resources
        </p>



        <input
        type="text"
        id="searchInput"
        placeholder="Search notes, chapters, subjects..."
        >


    </div>


</header>





<!-- =====================
     Announcement
===================== -->


<section class="announcement container">


    <h2>
        Announcements
    </h2>


    <div id="announcementBox">

        Loading...

    </div>


</section>






<!-- =====================
     Resources
===================== -->


<main class="container">


    <h2>
        Latest Resources
    </h2>



    <div 
    id="resourceContainer"
    class="resource-grid"
    >


        <p class="loading">
            Loading resources...
        </p>


    </div>



</main>






<!-- =====================
     Footer
===================== -->


<footer class="footer">


    <div class="container">


        <h3>
            The Scholars
        </h3>


        <p>
            Learn smarter with organised educational resources.
        </p>


        <p>
            © 2026 The Scholars. All rights reserved.
        </p>


    </div>


</footer>




<!-- Scripts -->


<script src="js/supabase.js"></script>

<script src="js/app.js"></script>



</body>

</html>
