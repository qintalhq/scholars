<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login • The Scholars</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:#f5f5f5;
        }

        .login-box{
            width:100%;
            max-width:420px;
            background:white;
            padding:35px;
            border-radius:10px;
            border:1px solid #ddd;
        }

        .login-box h1{
            color:#d32f2f;
            margin-bottom:25px;
            text-align:center;
        }

        .login-box input{
            width:100%;
            margin-bottom:15px;
        }

        #message{
            margin-top:15px;
            text-align:center;
            color:#d32f2f;
        }

    </style>

</head>
<body>

<div class="login-box">

    <h1>The Scholars</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button
            class="open-btn"
            style="width:100%;"
        >
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/supabase.js"></script>

<script>

const form=document.getElementById("loginForm");

const message=document.getElementById("message");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const {error}=await window.supabaseClient.auth.signInWithPassword({

email:email.value,

password:password.value

});

if(error){

message.textContent=error.message;

return;

}

window.location.href="admin/index.html";

});

</script>

</body>
</html>
